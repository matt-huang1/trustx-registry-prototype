# Tier-weighting profiles — WHICH dimensions drive the risk tier, per system type.
#
# All 12 ARC dimensions are ALWAYS scored (classifier/schema.py DIMENSIONS); a
# profile only chooses which of those scores the worst-case-wins rollup tiers
# off. This file is the explicit, committed encoding of a divergence found in
# the reference material: the AEGIS classification tools tier off 5 critical
# dimensions for most system types (12 + the autonomy level for transaction /
# commerce agents), while the reference registry states worst-case-wins across
# all 12. Rather than silently picking one, tier weighting is DATA — inspectable,
# reviewable, per-type. See docs/adr/0012-*.md.
#
# Rule, over a profile's tier_dimensions (worst-case-wins):
#   any dimension = 3            -> Tier 3 (high)
#   else max = 2 or avg >= 1.5   -> Tier 2 (medium)
#   else                         -> Tier 1 (low)
# If use_autonomy_level is true, autonomy_level 3 also forces Tier 3.
#
# `default_profile` applies to any entry with no system_type, or a system_type
# with no profile here. tier_dimensions: ALL_12 means every scored dimension.
# Profile names/sets are seeded verbatim from assets/arc_reference.json
# "tier_weighting_profiles" (derived from the AEGIS v1.1 tool formulas).

default_profile: recommended_default

profiles:
  autonomous_agent:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  coding_assistant:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  decision_support_system:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  embedded_physical_ai:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  knowledge_assistant:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  recommended_default:
    tier_dimensions: ALL_12
    use_autonomy_level: false
    why: worst-case-wins over all 12 so no dangerous dimension (e.g. Data Sensitivity=3) can
      be ignored; matches what the reference registry states.
  tool_using_agent:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    use_autonomy_level: false
  transaction_commerce_agent:
    tier_dimensions:
    - autonomy
    - decision_scope
    - temporal_coupling
    - action_authority
    - system_reach
    - blast_radius
    - persistence
    - reversibility
    - control_authority
    - data_sensitivity
    - aggregation_risk
    - data_egress_paths
    use_autonomy_level: true
