# Tier-weighting profiles — WHICH dimensions drive the risk tier, per system type.
#
# All 12 ARC dimensions are ALWAYS scored (classifier/schema.py DIMENSIONS); a
# profile only chooses which of those scores the worst-case-wins rollup tiers
# off.
#
# CURRENT RULE (RAI confirmation, 2026-08-16). Every per-type profile now
# implements the published ARC rule (arXiv:2607.09586 Section 3.3): worst-case-
# wins across ALL 12 dimensions, plus the autonomy-level provisions. RAI has
# confirmed verbally, from the framework's author, that the per-type
# five-dimension tier formulas carried by the v1.1 classification spreadsheets
# are an OUTDATED version of the model and that Section 3.3 is the current rule.
# The divergence recorded in docs/adr/0012-*.md is therefore resolved — as an
# implementation artefact of the tools, not an alternative reading of the
# framework. See docs/adr/0019-*.md.
#
# The superseded subsets are preserved below under `legacy_<type>_v1_1` keys so
# the historical behaviour stays inspectable and testable. They are inert: no
# system_type resolves to them (resolve_profile matches a profile whose key IS
# the system type), so they never tier a live entry.
#
# Rule, over a profile's tier_dimensions (worst-case-wins):
#   any dimension = 3            -> Tier 3 (high)
#   else max = 2 or avg >= 1.5   -> Tier 2 (medium)
#   else                         -> Tier 1 (low)
# autonomy_rule then applies the ARC paper's autonomy-level rule (Section 3.3;
# autonomy_level is L1-L5):
#   arc_paper : L5 forces Tier 3; L3/L4 lift the tier to at least Tier 2
#               (never lowers a dimension-derived tier).
#   none      : the autonomy level does not affect the tier (faithful to the
#               superseded per-type tool spreadsheets, which do not use it).
#
# `default_profile` applies to any entry with no system_type, or a system_type
# with no profile here. tier_dimensions: ALL_12 means every scored dimension.
# Tier weighting stays DATA rather than code precisely so a correction like this
# one is a reviewable diff with a recorded rationale (ADR-0012, ADR-0019).

default_profile: recommended_default

profiles:
  # ----------------------------------------------------------------------- #
  # Current rule — the paper's Section 3.3, applied to every system type.
  # ----------------------------------------------------------------------- #
  autonomous_agent:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  coding_assistant:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  decision_support_system:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  embedded_physical_ai:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  knowledge_assistant:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  recommended_default:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
    why: implements the published ARC rule (arXiv:2607.09586 Section 3.3) exactly —
      worst-case-wins over all 12 so no dangerous dimension (e.g. Data Sensitivity=3)
      can be ignored, L5 forces Tier 3, and L3/L4 lift the tier to at least Tier 2
      (ADR-0017).
  tool_using_agent:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper
  transaction_commerce_agent:
    tier_dimensions: ALL_12
    autonomy_rule: arc_paper

  # ----------------------------------------------------------------------- #
  # historical behaviour of the v1.1 classification tools; confirmed superseded
  # by RAI 2026-08-16; retained for auditability.
  # ----------------------------------------------------------------------- #
  legacy_autonomous_agent_v1_1:
    tier_dimensions:
    - autonomy
    - action_authority
    - blast_radius
    - persistence
    - reversibility
    autonomy_rule: none
  legacy_coding_assistant_v1_1:
    tier_dimensions:
