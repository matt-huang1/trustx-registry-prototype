agent:
  slug: kyc-onboarding-triage-agent
  description: >-
    A KYC onboarding triage agent that reads sensitive customer personal data (PII) — identity
    documents, addresses, and dates of birth — to draft an onboarding risk recommendation
    for a human compliance officer. It cannot approve onboarding, open accounts, or act autonomously;
    a human officer makes every decision.
system_type: tool_using_agent
autonomy_level: 1
dimensions:
  autonomy:
    score: 1
    rationale: 'Human-in-the-loop: a human compliance officer makes every decision.'
    evidence:
    - a human officer makes every decision
    - It cannot approve onboarding, open accounts, or act autonomously
  decision_scope:
    score: 2
    rationale: 'Domain-level: its recommendations shape the onboarding/KYC compliance domain.'
    evidence:
    - draft an onboarding risk recommendation for a human compliance officer
  temporal_coupling:
    score: 1
    rationale: 'Isolated actions: one applicant triaged per request; no chained workflow described.'
    evidence:
    - draft an onboarding risk recommendation
  action_authority:
    score: 1
    rationale: 'Read-only / advisory: it drafts a recommendation and can take no action itself.'
    evidence:
    - It cannot approve onboarding, open accounts, or act autonomously
  system_reach:
    score: 1
    rationale: 'Single system: reads the customer PII presented for onboarding; no other systems.'
    evidence:
    - reads sensitive customer personal data (PII)
  blast_radius:
    score: 2
    rationale: >-
      Team / department: its recommendations steer the compliance team's onboarding decisions
      across every applicant it triages.
    evidence:
    - draft an onboarding risk recommendation for a human compliance officer
  persistence:
    score: 1
    rationale: 'Stateless: triages per applicant; no session or long-term memory described.'
    evidence:
    - draft an onboarding risk recommendation
  reversibility:
    score: 1
    rationale: 'Fully reversible: a recommendation binds nothing — the human officer decides.'
    evidence:
    - a human officer makes every decision
  control_authority:
    score: 1
    rationale: 'Standalone: supervises or orchestrates no other agents.'
    evidence:
    - It cannot approve onboarding, open accounts, or act autonomously
  data_sensitivity:
    score: 3
    rationale: >-
      Regulated / crown-jewel: handles regulated identity PII — identity documents, addresses,
      dates of birth.
    evidence:
    - reads sensitive customer personal data (PII)
    - identity documents, addresses, and dates of birth
  aggregation_risk:
    score: 2
    rationale: 'Limited: combines identity attributes into a per-applicant risk recommendation.'
    evidence:
    - identity documents, addresses, and dates of birth
  data_egress_paths:
    score: 1
    rationale: 'Constrained outputs: the only output is a recommendation to the officer.'
    evidence:
    - draft an onboarding risk recommendation for a human compliance officer
risk_tier: medium
tier_derivation:
  profile: tool_using_agent
  tier_dimensions:
  - autonomy
  - action_authority
  - blast_radius
  - persistence
  - reversibility
  driving_dimensions:
  - blast_radius
  autonomy_level_driven: false
challenge:
  flagged: false
  notes:
  - >-
    Curated, human-authored reference entry; scores reasoned by hand against the ARC 12-dimension
    model. No automated challenger pass was run.
  - >-
    Tier-weighting note: under the tool_using_agent profile the tier is weighted off autonomy,
    action_authority, blast_radius, persistence and reversibility; blast_radius=2 drives Tier
    2 (medium). data_sensitivity=3 (regulated identity PII) is scored but does NOT drive the
    tier under this profile — under the recommended_default all-12 profile it would force
    Tier 3 (high). This entry is the concrete case for the divergence recorded in docs/adr/0012-*.md.
  iterations: 1
provenance:
  submitted_by: curated-reference
  approved_by: '@matt-huang1'
  timestamp: '2026-07-09T00:00:00+00:00'
