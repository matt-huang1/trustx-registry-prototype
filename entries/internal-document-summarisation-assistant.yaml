agent:
  slug: internal-document-summarisation-assistant
  description: >-
    An internal document summarisation assistant with read-only access to the company's internal
    document store. It produces draft summaries of internal documents that are always reviewed
    by a human before use. It cannot take any action, call external tools, or modify any record.
system_type: knowledge_assistant
autonomy_level: 1
dimensions:
  autonomy:
    score: 1
    rationale: 'Human-in-the-loop: every draft summary is reviewed by a human before use.'
    evidence:
    - draft summaries ... always reviewed by a human before use
    - It cannot take any action
  decision_scope:
    score: 1
    rationale: 'Local decisions: each summary concerns one document; nothing wider is decided.'
    evidence:
    - produces draft summaries of internal documents
  temporal_coupling:
    score: 1
    rationale: 'Isolated actions: one summary per request, no chained workflow or loop.'
    evidence:
    - produces draft summaries of internal documents
  action_authority:
    score: 1
    rationale: 'Read-only / advisory: it cannot act, call tools, or change any record.'
    evidence:
    - It cannot take any action, call external tools, or modify any record
  system_reach:
    score: 1
    rationale: 'Single system: read-only access to the internal document store only.'
    evidence:
    - read-only access to the company's internal document store
  blast_radius:
    score: 1
    rationale: 'Single user: a draft goes to the one human who reviews it before use.'
    evidence:
    - draft summaries ... always reviewed by a human before use
  persistence:
    score: 1
    rationale: 'Stateless: summarises per document; no session or long-term memory described.'
    evidence:
    - produces draft summaries of internal documents
  reversibility:
    score: 1
    rationale: 'Fully reversible: an unused draft can simply be discarded.'
    evidence:
    - draft summaries ... always reviewed by a human before use
  control_authority:
    score: 1
    rationale: 'Standalone: supervises or orchestrates no other agents.'
    evidence:
    - It cannot take any action, call external tools, or modify any record
  data_sensitivity:
    score: 2
    rationale: 'Internal / confidential: reads internal business documents, not public or
      regulated data.'
    evidence:
    - read-only access to the company's internal document store
    - draft summaries of internal documents
  aggregation_risk:
    score: 1
    rationale: 'No aggregation: summarises one document at a time; no cross-document inference.'
    evidence:
    - produces draft summaries of internal documents
  data_egress_paths:
    score: 1
    rationale: 'Constrained outputs: the only output is a draft handed to a human reviewer.'
    evidence:
    - draft summaries ... always reviewed by a human before use
    - cannot ... call external tools
risk_tier: low
tier_derivation:
  profile: knowledge_assistant
  tier_dimensions:
  - autonomy
  - action_authority
  - blast_radius
  - persistence
  - reversibility
  driving_dimensions:
  - autonomy
  - action_authority
  - blast_radius
  - persistence
  - reversibility
  autonomy_level_driven: false
challenge:
  flagged: false
  notes:
  - >-
    Curated, human-authored reference entry; scores reasoned by hand against the ARC 12-dimension
    model. No automated challenger pass was run.
  - >-
    Tier-weighting note: under the knowledge_assistant profile the tier is weighted off autonomy,
    action_authority, blast_radius, persistence and reversibility (all Tier 1 here). Under
    the recommended_default all-12 profile, data_sensitivity=2 (internal documents) would
    lift this entry to medium — see docs/adr/0012-*.md on the tier-weighting divergence.
  iterations: 1
provenance:
  submitted_by: curated-reference
  approved_by: '@matt-huang1'
  timestamp: '2026-07-09T00:00:00+00:00'
