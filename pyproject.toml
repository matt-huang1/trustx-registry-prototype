[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustx-registry-prototype"
version = "0.0.1"
description = "Prototype open-source AI-agent risk registry with a maker/checker classifier."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "langgraph>=0.2",
    "openai>=1.30",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
]

[project.scripts]
trustx-classify = "classifier.run:main"

[tool.setuptools]
packages = ["classifier"]

[tool.black]
line-length = 90
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
